[tui]
auto_recap = false
status_line = ["run-state", "current-dir", "git-branch", "model-with-reasoning", "fast-mode", "permissions", "approval-mode", "task-progress", "context-used", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]

notifications = true
notification_method = "bel"
notification_condition = "always"

[tui.keymap.pager]
page_up = []
page_down = []
half_page_up = ["page-up"]
half_page_down = ["page-down"]

[features]
codex_git_commit = false
