schemaVersion: "2"
kind: mixin
name: codex-personal
displayName: Personal Codex config
description: Merge personal Codex CLI settings and install official tgrep integration.
requires:
  agent: codex
setup:
  install:
    - description: Install Python, tomlkit, curl, and CA certificates
      user: "0"
      command: |
        set -e

        if /usr/bin/python3 -c 'import tomlkit' >/dev/null 2>&1 &&
          command -v curl >/dev/null 2>&1 &&
          [ -s /etc/ssl/certs/ca-certificates.crt ]
        then
          exit 0
        fi

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-tomlkit curl ca-certificates
    - description: Install tgrep from the latest release with its official script
      user: "0"
      command: |
        set -eu

        tgrep_tmp="$(mktemp -d)"
        trap 'rm -rf "$tgrep_tmp"' EXIT
        curl -fsSL https://api.github.com/repos/microsoft/tgrep/releases/latest -o "$tgrep_tmp/release.json"
        tgrep_tag="$(jq -er '.tag_name' "$tgrep_tmp/release.json")"
        curl -fsSL "https://github.com/microsoft/tgrep/archive/refs/tags/$tgrep_tag.tar.gz" -o "$tgrep_tmp/source.tar.gz"
        install -d /usr/local/share/tgrep
        tar -xzf "$tgrep_tmp/source.tar.gz" --strip-components=1 -C /usr/local/share/tgrep
        TGREP_VERSION="$tgrep_tag" TGREP_INSTALL_DIR=/usr/local/bin bash /usr/local/share/tgrep/scripts/install.sh
  startup:
    # sbx が model_provider や mcp_servers を書き込むため、静的配置で config.toml を上書きできない。
    - description: Merge personal Codex settings into config.toml
      # ~/.codex を root 所有で作る場合があり、agent では書き込めないため root で実行する。
      user: "0"
      command:
        - /usr/bin/python3
        - -c
        - |
          from collections.abc import Mapping
          from itertools import chain
          from pathlib import Path
          import os
          import pwd
          import time

          import tomlkit
          from tomlkit.exceptions import ParseError

          def wait_for_defaults(config):
              # sbx が既定値を書き込む前にマージすると、その後の初期化で消えるため待つ。
              for _ in range(60):
                  try:
                      defaults = tomlkit.parse(config.read_text(encoding="utf-8"))
                  except (FileNotFoundError, UnicodeDecodeError, ParseError):
                      # 書き込み途中の TOML を既定値として扱わない。
                      pass
                  else:
                      if defaults.get("model_provider") == "sandboxd":
                          return defaults
                  time.sleep(1)
              raise SystemExit(f"codex-personal: {config} に sbx 既定値が現れませんでした。中断します。")

          def merge_missing(settings, additions):
              for key, value in additions.items():
                  if key not in settings:
                      settings[key] = value
                  elif isinstance(settings[key], Mapping) and isinstance(value, Mapping):
                      merge_missing(settings[key], value)

          src = Path("/home/agent/.config/codex-personal/config.toml")
          config_dir = Path("/home/agent/.codex")
          config = config_dir / "config.toml"
          agent = pwd.getpwnam("agent")
          try:
              config_dir.mkdir(parents=True, exist_ok=True)
              defaults = wait_for_defaults(config)
              personal = tomlkit.parse(src.read_text(encoding="utf-8"))
              # 個人設定で model_provider や mcp_servers を上書きしないよう、sbx の設定を優先する。
              merge_missing(defaults, personal)
              tmp = config.with_name(config.name + ".tmp")
              tmp.write_text(tomlkit.dumps(defaults), encoding="utf-8")
              tmp.chmod(0o644)
              tmp.replace(config)
          finally:
              for path in chain([config_dir], config_dir.rglob("*")):
                  try:
                      os.chown(path, agent.pw_uid, agent.pw_gid, follow_symlinks=False)
                  except OSError:
                      # 所有者の復元に失敗しても、待機・マージで起きたエラーを隠さない。
                      pass
    - description: Configure tgrep after merging personal Codex settings
      user: "agent"
      command:
        - /bin/bash
        - /usr/local/share/tgrep/install-agent.sh
        - install
        - --agent
        - codex
        - --scope
        - user
        - --binary
        - /usr/local/bin/tgrep
