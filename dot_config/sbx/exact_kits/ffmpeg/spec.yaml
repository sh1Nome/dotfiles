schemaVersion: "2"
kind: mixin
name: ffmpeg
displayName: FFmpeg
description: Install ffmpeg and ffprobe using apt on Ubuntu or Debian sandboxes.
setup:
  install:
    - description: Install ffmpeg and ffprobe
      user: "0"
      command: |
        set -e

        if command -v ffmpeg >/dev/null 2>&1 &&
          command -v ffprobe >/dev/null 2>&1
        then
          exit 0
        fi

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ffmpeg
