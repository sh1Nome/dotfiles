schemaVersion: "2"
kind: mixin
name: ffmpeg
displayName: FFmpeg
description: Install ffmpeg, ffprobe, and Japanese fonts using apt on Ubuntu or Debian sandboxes.
setup:
  install:
    - description: Install ffmpeg and ffprobe
      user: "0"
      command: |
        set -e

        if command -v ffmpeg >/dev/null 2>&1 &&
          command -v ffprobe >/dev/null 2>&1
        then
          exit 0
        fi

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ffmpeg
    - description: Install Noto CJK fonts
      user: "0"
      command: |
        set -e

        if [ "$(dpkg-query --show --showformat='${Status}' fonts-noto-cjk 2>/dev/null)" = "install ok installed" ]
        then
          exit 0
        fi

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends fonts-noto-cjk
