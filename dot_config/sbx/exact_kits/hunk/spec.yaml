schemaVersion: "2"
kind: mixin
name: hunk
displayName: Hunk review
description: Install Hunk and its review skill for sandbox review sessions.
setup:
  install:
    - description: Install Hunk from the latest release
      user: "0"
      command: |
        set -eu

        hunk_tmp="$(mktemp -d)"
        trap 'rm -rf "$hunk_tmp"' EXIT
        # hunk.dev にアクセスできないため、公式の手順を使わず GitHub からインストールスクリプトを取得する。
        curl -fsSL https://api.github.com/repos/modem-dev/hunk/releases/latest -o "$hunk_tmp/release.json"
        hunk_tag="$(jq -er '.tag_name' "$hunk_tmp/release.json")"
        curl -fsSL "https://github.com/modem-dev/hunk/archive/refs/tags/$hunk_tag.tar.gz" -o "$hunk_tmp/source.tar.gz"
        tar -xzf "$hunk_tmp/source.tar.gz" --strip-components=1 -C "$hunk_tmp"
        HUNK_VERSION="$hunk_tag" HUNK_INSTALL_DIR=/usr/local/share/hunk HUNK_NO_MODIFY_PATH=1 sh "$hunk_tmp/install.sh"
        ln -sfn /usr/local/share/hunk/hunk /usr/local/bin/hunk
  startup:
    - description: Make the bundled review skill available to Codex and Claude Code
      user: "0"
      command:
        - sh
        - -c
        - |
          set -eu

          for config_dir in /home/agent/.agents /home/agent/.claude
          do
            skills_dir="$config_dir/skills"
            mkdir -p "$skills_dir"
            ln -sfnT /usr/local/share/hunk/skills/hunk-review "$skills_dir/hunk-review"
            chown -h agent:agent "$config_dir" "$skills_dir" "$skills_dir/hunk-review"
          done
